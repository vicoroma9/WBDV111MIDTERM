<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order - PadyakHub</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#f4f4f4;
}

/* NAV */
header{
    background:#2e7d32;
    padding:15px 50px;
    color:white;
    display:flex;
    justify-content:space-between;
}

nav a{
    color:white;
    margin-left:15px;
    text-decoration:none;
    font-weight:bold;
}

/* TITLE */
h2{
    text-align:center;
    margin:20px;
}

/* PRODUCTS */
.container{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    width:220px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
    text-align:center;
    overflow:hidden;
}

.card img{
    width:100%;
    height:180px;
    object-fit:cover;
    border-radius:5px;
    display:block;
}

.card h3{
    margin-top:10px;
}

.card p{
    margin:5px 0;
    font-weight:bold;
}

.card button{
    margin-top:10px;
    padding:8px;
    background:#2e7d32;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

/* CART */
.cart{
    background:white;
    margin:20px auto;
    width:80%;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

#total{
    font-weight:bold;
}

/* CHECKOUT */
.checkout-btn{
    margin-top:10px;
    padding:10px;
    background:#4caf50;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}
</style>
</head>

<body>

<header>
    <h3>PadyakHub Order</h3>
    <nav>
        <a href="index.html">Home</a>
        <a href="parts.html">Parts</a>
        <a href="cart.html">Cart</a>
        <a href="services.html">Services</a>
        <a href="order.html">Order</a>
    </nav>
</header>

<h2>Order Your Bike Parts & Services</h2>

<div class="container">

    <div class="card">
        <img src="biketire.jpg" alt="Bike Tire">
        <h3>Bike Tire</h3>
        <p>₱500</p>
        <button onclick="addToCart('Bike Tire',500)">Add</button>
    </div>

    <div class="card">
        <img src="brakeset.jpg" alt="Brake Set">
        <h3>Brake Set</h3>
        <p>₱800</p>
        <button onclick="addToCart('Brake Set',800)">Add</button>
    </div>

    <div class="card">
        <img src="bikechain.jpg" alt="Bike Chain">
        <h3>Bike Chain</h3>
        <p>₱300</p>
        <button onclick="addToCart('Bike Chain',300)">Add</button>
    </div>

    <div class="card">
        <img src="bikerepair.jpg" alt="Repair Service">
        <h3>Repair Service</h3>
        <p>₱200</p>
        <button onclick="addToCart('Repair Service',200)">Book</button>
    </div>

</div>

<script>
function addToCart(name, price){
    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    cart.push({name, price});
    localStorage.setItem("cart", JSON.stringify(cart));
    alert(name + " added to cart!");
}
</script>

</body>
</html>
