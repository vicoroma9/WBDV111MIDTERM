<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Super Admin Dashboard</title>

<link rel="stylesheet" href="style.css">

<style>
body{
    display:flex;
}

/* SIDEBAR */
.sidebar{
    width:240px;
    background:#1b5e20;
    color:white;
    height:100vh;
    padding:20px;
}

.sidebar h2{
    margin-bottom:15px;
}

.sidebar a{
    display:block;
    color:white;
    text-decoration:none;
    padding:10px 0;
    border-bottom:1px solid rgba(255,255,255,0.2);
}

.sidebar a:hover{
    background:#2e7d32;
    padding-left:10px;
}

/* SUB MENU STYLE */
.sub{
    padding-left:15px;
    font-size:14px;
}

/* MAIN */
.main{
    flex:1;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
    margin-bottom:20px;
}
</style>

</head>

<body>


<div class="sidebar">
    <h2>Super Admin</h2>


    <a href="login.html">Log Out</a>
</div>


<div class="main">

    <div class="card">
        <h2>Super Admin Dashboard</h2>
        <p id="track"></p>
    </div>

    <div class="card">
        <h3>Admin Accounts</h3>
        <div id="admins"></div>
    </div>

    <div class="card">
        <h3>User Accounts</h3>
        <div id="users"></div>
    </div>

    <div class="card">
        <h3>Transactions</h3>
        <div id="orders"></div>
    </div>

</div>

<script>
let user = localStorage.getItem("currentUser");
let role = localStorage.getItem("role");


if(role !== "superadmin"){
    location.href = "login.html";
}


document.getElementById("track").innerText =
"Logged in as: " + user + " (" + role + ")";

let users = JSON.parse(localStorage.getItem("users")) || [];
let orders = JSON.parse(localStorage.getItem("orders")) || [];


let admins = users.filter(u => u.role === "admin");
let normal = users.filter(u => u.role === "user");


document.getElementById("admins").innerHTML =
admins.map(a => `<p>👨‍💼 ${a.username}</p>`).join("");

S
document.getElementById("users").innerHTML =
normal.map(u => `<p>👤 ${u.username}</p>`).join("");


document.getElementById("orders").innerHTML =
orders.map(o => `<p>🛒 ${o.user} ordered ${o.items.length} items</p>`).join("");
</script>

</body>
</html>
