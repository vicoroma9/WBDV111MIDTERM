<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order - PadyakHub</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#f4f4f4;
}

header{
    background:#2e7d32;
    padding:15px 50px;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

nav a{
    color:white;
    margin-left:15px;
    text-decoration:none;
    font-weight:bold;
}

h2{
    text-align:center;
    margin:20px;
}

.container{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    width:220px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
    text-align:center;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card img{
    width:100%;
    height:180px;
    object-fit:cover;
    border-radius:5px;
}

.card h3{
    margin-top:10px;
}

.btn{
    margin-top:10px;
    display:inline-block;
    padding:10px;
    background:#2e7d32;
    color:white;
    text-decoration:none;
    border-radius:5px;
    font-weight:bold;
}

.btn:hover{
    background:#1b5e20;
}
</style>

</head>

<body>

<header>
    <h3>PadyakHub Order</h3>
    <nav>
        <a href="index.html">Home</a>
        <a href="parts.html">Parts</a>
        <a href="cart.html">Cart</a>
        <a href="order.html">Order</a>
    </nav>
</header>

<h2>Shop Categories</h2>

<div class="container">

    <div class="card">
        <img src="biketire.jpg">
        <h3>Bike Tire</h3>
        <a class="btn" href="category.html?item=biketire">View Category</a>
    </div>

    <div class="card">
        <img src="brakeset.jpg">
        <h3>Brake Set</h3>
        <a class="btn" href="category.html?item=brakeset">View Category</a>
    </div>

    <div class="card">
        <img src="bikechain.jpg">
        <h3>Bike Chain</h3>
        <a class="btn" href="category.html?item=bikechain">View Category</a>
    </div>

    <div class="card">
        <img src="handlebar.jpg">
        <h3>Handlebar</h3>
        <a class="btn" href="category.html?item=handlebar">View Category</a>
    </div>


</div>

</body>
</html>
