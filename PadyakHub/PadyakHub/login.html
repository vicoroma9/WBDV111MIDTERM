<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login</title>

<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>

<script>
let users = JSON.parse(localStorage.getItem("users")) || [];

// create default superadmin ONLY if not exists
let hasSuper = users.some(u => 
    u.username === "superadmin" && u.role === "superadmin"
);

if(!hasSuper){
    users.push({
        username: "superadmin",
        password: "1234",
        role: "superadmin"
    });

    localStorage.setItem("users", JSON.stringify(users));
}
</script>

</head>

<body>

<header>
    <h2>Login</h2>
</header>

<div class="box">

    <h2>Login</h2>

    <input id="user" placeholder="username">
    <input id="pass" type="password" placeholder="password">

    <button onclick="login()">Login</button>

    <p style="margin-top:10px;">
        No account?
        <a href="register.html">Register here</a>
    </p>

</div>

<script>
function login(){

    let u = document.getElementById("user").value.trim();
    let p = document.getElementById("pass").value.trim();

    let users = JSON.parse(localStorage.getItem("users")) || [];

    let found = users.find(x =>
        x.username === u && x.password === p
    );

    if(!found){
        alert("Invalid login");
        return;
    }

    // CLEAN ROLE (IMPORTANT FIX)
    let role = (found.role || "")
        .toLowerCase()
        .replace(/\s/g, "");

    localStorage.setItem("currentUser", found.username);
    localStorage.setItem("role", role);

    if(role === "user"){
        location.href = "dashboard.html";
    }
    else if(role === "admin"){
        location.href = "admin.html";
    }
    else if(role === "superadmin"){
        location.href = "superadmin.html";
    }
    else {
        alert("Unknown role");
    }
}
</script>

</body>
</html>
