<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - PadyakHub</title>

<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>

<style>
.container{
    padding:30px;
}

.box{
    background:white;
    padding:20px;
    border-radius:10px;
    width:80%;
    margin:20px auto;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.item{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid #ddd;
}

.total{
    font-size:18px;
    font-weight:bold;
    margin-top:10px;
    text-align:right;
}

button{
    width:100%;
    margin-top:15px;
    padding:12px;
    background:#2e7d32;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}
</style>
</head>

<body>

<header class="ph-header">
    <div class="ph-logo">
        <img src="logo.png" alt="Logo">
        <h2>PadyakHub</h2>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="order.html">Order</a>
        <a href="checkout.html">Checkout</a>
        <a href="dashboard.html">Dashboard</a>
    </nav>

    <button onclick="logout()">Log Out</button>
</header>

<div class="container">

    <div class="box">
        <h2>Your Checkout</h2>

        <div id="cartList"></div>

        <p class="total" id="total">Total: ₱0</p>

        <button onclick="checkout()">Confirm Order</button>
    </div>

</div>

<script>

requireLogin();

let cart = getCart();

let cartList = document.getElementById("cartList");
let total = 0;

function renderCart(){
    cartList.innerHTML = "";
    total = 0;

    cart.forEach((item, index) => {
        cartList.innerHTML += `
            <div class="item">
                <span>${item.name}</span>
                <span>₱${item.price}</span>
            </div>
        `;
        total += item.price;
    });

    document.getElementById("total").innerText = "Total: ₱" + total;
}

renderCart();

function checkout(){
    if(cart.length === 0){
        alert("Cart is empty!");
        return;
    }

    let orders = JSON.parse(localStorage.getItem("orders")) || [];

    orders.push({
        user: getCurrentUser(),
        items: cart,
        total: total,
        status: "Pending",
        date: new Date().toLocaleString()
    });

    localStorage.setItem("orders", JSON.stringify(orders));
    localStorage.removeItem("cart");

    alert("Order placed successfully!");
    window.location.href = "receipt.html";
}

</script>

</body>
</html>
