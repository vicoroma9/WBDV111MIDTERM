<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us - PadyakHub</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#f4f4f4;
}

/* NAVBAR */
header{
    background:#2e7d32;
    padding:15px 50px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:white;
}

header h1{
    font-size:22px;
}

nav a{
    color:white;
    margin-left:20px;
    text-decoration:none;
    font-weight:bold;
}

nav a:hover{
    text-decoration:underline;
}

/* TITLE */
.hero{
    background:#4caf50;
    color:white;
    text-align:center;
    padding:60px;
}

.hero h2{
    font-size:35px;
}

/* CONTAINER */
.container{
    width:60%;
    margin:50px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

/* FORM */
input, textarea{
    width:100%;
    padding:10px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    width:100%;
    padding:10px;
    background:#2e7d32;
    color:white;
    border:none;
    font-size:16px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#1b5e20;
}

/* INFO */
.info{
    text-align:center;
    margin-top:20px;
    color:gray;
}

/* FOOTER */
footer{
    background:#2e7d32;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:30px;
}
</style>
</head>

<body>


<header>
    <h1>PadyakHub</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="parts.html">Parts</a>
        <a href="services.html">Services</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>


<div class="hero">
    <h2>Contact Us</h2>
    <p>We are here to help you 🚴</p>
</div>


<div class="container">

    <input type="text" id="name" placeholder="Your Name">
    <input type="email" id="email" placeholder="Your Email">
    <textarea id="message" rows="5" placeholder="Your Message"></textarea>

    <button onclick="sendMessage()">Send Message</button>

    <p class="info">
        📍 PadyakHub Bike Shop<br>
        📞 0955 815 0502<br>
        📧 padyakhub@email.com
    </p>

</div>


<footer>
    <p>© 2026 PadyakHub | All Rights Reserved</p>
</footer>

<script>
function sendMessage(){
    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let message = document.getElementById("message").value;

    if(name === "" || email === "" || message === ""){
        alert("Please fill all fields");
        return;
    }

    alert("Message sent successfully!");

    document.getElementById("name").value = "";
    document.getElementById("email").value = "";
    document.getElementById("message").value = "";
}
</script>

</body>
</html>
